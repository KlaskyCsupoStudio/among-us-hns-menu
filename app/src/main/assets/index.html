<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide n Seek Menu</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #10131c;
  color: white;
  font-family: system-ui, sans-serif;
}

.menu {
  width: min(360px, 100%);
  padding: 24px;
  background: #202638;
  border: 1px solid #46516e;
  border-radius: 18px;
}

h2 { text-align: center; margin-top: 0; }
p { color: #b9c4da; line-height: 1.5; }

label {
  display: block;
  margin-top: 20px;
  font-weight: 600;
}

input, select, button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 9px;
  border-radius: 9px;
  font-size: 16px;
}

input, select {
  background: #111827;
  color: white;
  border: 1px solid #65718c;
}

#lobbyCode {
  text-transform: uppercase;
  letter-spacing: 4px;
  text-align: center;
}

.description { font-size: 13px; }

button {
  margin-top: 22px;
  background: #e64b55;
  color: white;
  border: 0;
  font-weight: bold;
}

button:disabled { opacity: 0.6; }

#status {
  font-size: 14px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main class="menu">
  <h2>Hide n Seek Menu</h2>
  <p>Private lobby settings</p>

  <label for="lobbyCode">Six-character lobby code</label>
  <input id="lobbyCode"
         type="text"
         placeholder="ABC123"
         minlength="6"
         maxlength="6"
         autocomplete="off"
         autocapitalize="characters"
         spellcheck="false">

  <p class="description">
    The code is saved on this device. It is not sent to a game server.
  </p>

  <label for="count">Requested seeker count</label>
  <select id="count">
    <option value="1">1 Seeker</option>
    <option value="2">2 Seekers</option>
    <option value="3">3 Seekers</option>
  </select>

  <button id="apply" type="button">Save Settings</button>

  <p id="status" role="status" aria-live="polite">
    Loading saved settings...
  </p>
</main>

<script>
"use strict";

const codeInput = document.getElementById("lobbyCode");
const count = document.getElementById("count");
const status = document.getElementById("status");
const apply = document.getElementById("apply");

function setStatus(message) {
  status.textContent = message;
}

function getAndroidBridge() {
  if (!window.AndroidSettings ||
      typeof window.AndroidSettings.loadSettings !== "function" ||
      typeof window.AndroidSettings.saveSettings !== "function") {
    return null;
  }
  return window.AndroidSettings;
}

function loadSettings() {
  const bridge = getAndroidBridge();

  if (!bridge) {
    apply.disabled = true;
    setStatus("Android bridge unavailable. Open the installed app.");
    return;
  }

  try {
    const saved = JSON.parse(bridge.loadSettings());

    codeInput.value = saved.lobbyCode || "";
    count.value = ["1", "2", "3"].includes(
      String(saved.seekerCount)
    ) ? String(saved.seekerCount) : "1";

    setStatus(
      "Android settings loaded. Game integration is not connected."
    );
  } catch (error) {
    setStatus("Could not load Android settings.");
  }
}

codeInput.addEventListener("input", () => {
  codeInput.value = codeInput.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 6);
});

apply.addEventListener("click", () => {
  const bridge = getAndroidBridge();
  const code = codeInput.value.trim();
  const seekerCount = Number(count.value);

  if (!bridge) {
    setStatus("Android bridge unavailable. Settings not saved.");
    return;
  }

  if (!/^[A-Z0-9]{6}$/.test(code)) {
    setStatus("Enter exactly 6 letters or numbers.");
    codeInput.focus();
    return;
  }

  if (![1, 2, 3].includes(seekerCount)) {
    setStatus("Choose between 1 and 3 seekers.");
    return;
  }

  try {
    const result = JSON.parse(
      bridge.saveSettings(code, seekerCount)
    );

    if (!result.ok) {
      setStatus(result.message || "Settings could not be saved.");
      return;
    }

    setStatus(
      "Saved on Android: " + result.seekerCount +
      " requested seeker(s). Game integration is not connected."
    );
  } catch (error) {
    setStatus("Android could not save these settings.");
  }
});

loadSettings();
</script>
</body>
</html>
