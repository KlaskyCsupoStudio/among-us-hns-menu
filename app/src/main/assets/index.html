<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide n Seek Menu</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #10131c;
    color: white;
    font-family: system-ui, sans-serif;
  }

  .menu {
    width: min(360px, 100%);
    padding: 24px;
    background: #202638;
    border: 1px solid #46516e;
    border-radius: 18px;
  }

  h2 { text-align: center; margin-top: 0; }
  p { color: #b9c4da; line-height: 1.5; }

  label {
    display: block;
    margin-top: 20px;
    font-weight: 600;
  }

  input, select, button {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 9px;
    border-radius: 9px;
    font-size: 16px;
  }

  input, select {
    background: #111827;
    color: white;
    border: 1px solid #65718c;
  }

  #lobbyCode {
    text-transform: uppercase;
    letter-spacing: 4px;
    text-align: center;
  }

  .description { font-size: 13px; }

  button {
    margin-top: 22px;
    background: #e64b55;
    color: white;
    border: 0;
    font-weight: bold;
  }

  #status {
    font-size: 14px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main class="menu">
  <h2>Hide n Seek Menu</h2>
  <p>Private lobby settings</p>

  <label for="lobbyCode">Enter 6-character lobby code</label>
  <input
    id="lobbyCode"
    type="text"
    placeholder="ABC123"
    minlength="6"
    maxlength="6"
    pattern="[A-Za-z0-9]{6}"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    aria-describedby="codeDescription"
  >
  <p id="codeDescription" class="description">
    Enter the six-character lobby code to configure your seeker settings.
  </p>

  <label for="count">Seeker count</label>
  <select id="count">
    <option value="1">1 Seeker</option>
    <option value="2">2 Seekers</option>
    <option value="3">3 Seekers</option>
  </select>

  <button id="apply" type="button">Save Settings</button>

  <p id="status" role="status" aria-live="polite">
    Not connected to the game.
  </p>
</main>

<script>
  const codeInput = document.getElementById("lobbyCode");
  const count = document.getElementById("count");
  const status = document.getElementById("status");

  try {
    const savedCode = localStorage.getItem("lobbyCode") || "";
    const savedCount = localStorage.getItem("seekerCount") || "1";

    codeInput.value = savedCode;
    if (["1", "2", "3"].includes(savedCount)) {
      count.value = savedCount;
    }
  } catch (e) {
    status.textContent = "Local storage is unavailable.";
  }

  codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .slice(0, 6);
  });

  document.getElementById("apply").addEventListener("click", () => {
    const code = codeInput.value.trim();

    if (!/^[A-Z0-9]{6}$/.test(code)) {
      status.textContent = "Please enter all 6 characters of the lobby code.";
      codeInput.focus();
      return;
    }

    try {
      localStorage.setItem("lobbyCode", code);
      localStorage.setItem("seekerCount", count.value);
      status.textContent =
        `Saved: ${count.value} seeker(s). Code saved locally. ` +
        "Game integration not connected.";
    } catch (e) {
      status.textContent = "Could not save settings.";
    }
  });
</script>
</body>
</html>
